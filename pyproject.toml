[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fasthep-render"
dynamic = ["version"]
description = "Rendering sinks and style helpers for FAST-HEP workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FAST-HEP contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "fasthep-flow",
    "fasthep-toolbench",
    "hist",
    "matplotlib",
    "mplhep",
    "numpy",
    "scipy", # for Garwood interval
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "2026.06.1"

[tool.hatch.build.hooks.vcs]
version-file = "src/fasthep_render/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fasthep_render"]

[tool.hatch.build.targets.sdist]
include = [
    "src/fasthep_render",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
  "src/fasthep_render/_version.py",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "B",
    "I",
    "ARG",
    "C4",
    "EM",
    "ICN",
    "ISC",
    "G",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "UP",
    "YTT",
]
ignore = [
  "E501",   # Line too long; handled pragmatically by formatter/review
  "PLR",    # Design-related pylint refactor recommendations
  "EM101",  # Raw string literals in exceptions are acceptable here
  "EM102",  # Allow inline f-strings in exceptions
  "EM103",  # Allow exception messages directly in raise statements
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "ARG"]
"src/fasthep_render/types/*.py" = [
  "ARG001",  # Registry call signatures may include optional ctx
  "ARG002",  # Registry call signatures may include optional ctx
]
"src/fasthep_render/transforms.py" = [
  "ARG001",  # Registry call signatures may include optional ctx
  "ARG002",  # Registry call signatures may include optional ctx
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
