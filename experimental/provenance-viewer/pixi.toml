# EXPERIMENTAL: isolated Node toolchain for the provenance viewer prototype only.
[workspace]
name = "provenance-viewer"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
nodejs = ">=22,<23"

[tasks]
install = "npm install"
dev = "npm run dev"
build = "npm run build"
test = "npm test"
typecheck = "npm run typecheck"
