      impl: fasthep_render.impl.sinks.hist1d:run_hist1d_render

    hep.render.data_mc:
      spec: fasthep_render.spec.sinks.data_mc:DATA_MC_RENDER_SPEC
      impl: fasthep_render.impl.sinks.data_mc:run_data_mc_render

    hep.render.heatmap2d:
